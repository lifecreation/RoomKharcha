<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Room Kharcha</title>
<style>
:root{--bg:#f4f6f3;--ink:#10201c;--mut:#64748b;--brand:#0d9488;--brand2:#0f766e;--card:#fff;--line:#e5e9e6;--good:#15803d;--bad:#dc2626;--c1:#0d9488;--c2:#f59e0b;--c3:#6366f1;--c4:#ec4899}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 110px}
button{font:inherit;border:0;cursor:pointer;border-radius:12px;padding:12px 16px;background:var(--brand2);color:#fff;font-weight:600}
button:active{transform:scale(.98)}
button:disabled{opacity:.5}
button.sec{background:#e8eeeb;color:var(--ink)}
button.ghost{background:none;color:var(--brand2);padding:8px 10px;font-weight:600}
button.icon{background:rgba(255,255,255,.18);color:#fff;padding:8px 12px;border-radius:99px;font-size:13px}
input{font:inherit;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;margin:6px 0}
input:focus{border-color:var(--brand)}
.hero{background:linear-gradient(135deg,#0f766e 0%,#0d9488 55%,#14b8a6 100%);color:#fff;border-radius:0 0 28px 28px;padding:18px 18px 22px;margin:0 -14px}
.hero .bar{display:flex;justify-content:space-between;align-items:center}
.hero h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
.pill{display:flex;align-items:center;justify-content:center;gap:2px;background:rgba(255,255,255,.16);border-radius:99px;padding:4px;margin:14px auto 0;width:fit-content}
.pill b{padding:0 10px;font-size:14px}
.pill button{background:none;padding:4px 12px;color:#fff;font-size:15px}
.total{text-align:center;margin-top:12px}
.total small{opacity:.85}
.total .n{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;margin-top:16px}
.codebox span{font-size:12px;opacity:.85;display:block}
.codebox b{font-size:22px;letter-spacing:5px;font-family:ui-monospace,Menlo,monospace}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(16,32,28,.05),0 6px 18px rgba(16,32,28,.04)}
.card h3{margin:0 0 12px;font-size:15px}
.people{display:flex;flex-direction:column;gap:12px}
.person{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none}
.person .i{flex:1;min-width:0}
.person .i b{display:block}
.person .i small{color:var(--mut)}
.st{font-weight:700;font-size:14px;text-align:right}
.st.good{color:var(--good)}.st.bad{color:var(--bad)}.st.eq{color:var(--mut)}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#eef2ef;margin-top:14px}
.split i{display:block;height:100%}
.cat{display:flex;align-items:center;gap:10px;margin:10px 0}
.cat .e{width:34px;height:34px;border-radius:10px;background:#ecf6f4;display:grid;place-items:center;font-size:18px;flex:none}
.cat .m{flex:1;min-width:0}
.cat .t{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.cat .b{height:6px;border-radius:99px;background:#eef2ef;margin-top:5px;overflow:hidden}
.cat .b i{display:block;height:100%;background:var(--brand);border-radius:99px}
.day{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin:18px 4px 6px}
.exp{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin:6px 0;box-shadow:0 1px 2px rgba(16,32,28,.05)}
.exp .e{width:42px;height:42px;border-radius:13px;background:#ecf6f4;display:grid;place-items:center;font-size:21px;flex:none}
.exp .m{flex:1;min-width:0}
.exp .m b{display:block}
.exp .m small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .a{font-weight:800}
.exp .x{background:none;color:#b6c0bc;padding:4px 6px;font-size:16px}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.empty .big{font-size:46px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));padding:15px 26px;border-radius:99px;font-size:16px;box-shadow:0 8px 24px rgba(15,118,110,.45);z-index:5}
.fab:active{transform:translateX(-50%) scale(.98)}
.sheet{border:0;border-radius:24px 24px 0 0;padding:20px 18px 24px;width:100%;max-width:560px;margin:auto auto 0;position:fixed;bottom:0}
dialog::backdrop{background:rgba(16,32,28,.5)}
.sheet h3{margin:0 0 6px}
.amt{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--brand);margin:8px 0 14px}
.amt span{font-size:34px;font-weight:700;color:var(--brand2)}
.amt input{border:0;font-size:38px;font-weight:800;padding:6px 0;margin:0;background:none}
.lbl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:99px;background:#eef2ef;cursor:pointer;font-size:14px;font-weight:600;user-select:none;border:1.5px solid transparent}
.chip.on{background:#e0f5f1;border-color:var(--brand);color:var(--brand2)}
.btns{display:flex;gap:10px;margin-top:18px}.btns button{flex:1}
.err{color:var(--bad);margin:8px 0;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#10201c;color:#fff;padding:12px 18px;border-radius:14px;z-index:20;max-width:90vw;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.setup{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:20px 0}
.logo{width:68px;height:68px;border-radius:22px;background:linear-gradient(135deg,#0f766e,#14b8a6);display:grid;place-items:center;font-size:34px;box-shadow:0 10px 24px rgba(15,118,110,.35)}
.setup h1{font-size:30px;margin:16px 0 4px}
.setup p{color:var(--mut);margin:0 0 20px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:16px 0 6px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.codein{letter-spacing:8px;text-align:center;font-size:22px;font-weight:700;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="wrap"><div id="view"></div></div>

<dialog id="addDlg" class="sheet">
  <h3>Naya kharcha</h3>
  <div class="amt"><span>₹</span><input id="aAmt" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
  <input id="aNote" placeholder="Note likho (optional) — jaise: 5 kg aata">
  <div class="lbl">Kharcha kis din/time ka hai?</div><input id="aWhen" type="datetime-local">
  <div class="lbl">Category</div><div class="chips" id="aCats"></div>
  <div class="lbl">Kisne diye?</div><div class="chips" id="aPayers"></div>
  <div class="btns"><button class="sec" onclick="addDlg.close()">Cancel</button><button id="saveBtn" onclick="saveExpense()">Save karo</button></div>
</dialog>

<dialog id="catDlg" class="sheet">
  <h3>Categories</h3>
  <div style="display:flex;gap:8px"><input id="cNew" placeholder="Nayi category (jaise: Chai)" style="margin:0"><button onclick="addCat()" style="flex:none">Add</button></div>
  <div id="cList" style="margin:12px 0;max-height:40vh;overflow:auto"></div>
  <button class="sec" style="width:100%" onclick="catDlg.close()">Done</button>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://lcoqsdxcyrrudxxwpshs.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxjb3FzZHhjeXJydWR4eHdwc2hzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NDg0NDAsImV4cCI6MjExMDAyNDQ0MH0.xhBat-gMObQ66VlXpdeOGUCmYxKWTce2dDjgCtcQzQg";

const DEFAULT_CATS = ["Rent","Groceries","Khana","Bijli Bill","WiFi","Doodh","Gas","Safai / Maid","Travel","Other"];
const EMOJI = {"rent":"🏠","groceries":"🛒","khana":"🍛","bijli bill":"💡","wifi":"📶","doodh":"🥛","gas":"🔥","safai / maid":"🧹","travel":"🚌","other":"🧾","chai":"☕","recharge":"📱","medicine":"💊"};
const COLORS = ["#0d9488","#f59e0b","#6366f1","#ec4899","#0ea5e9","#84cc16"];
const CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rs = n => "₹" + (Number.isInteger(n) ? n.toLocaleString("en-IN") : n.toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2}));
const em = c => EMOJI[(c || "other").toLowerCase()] || "🏷️";
const ls = k => { try { return localStorage.getItem(k) } catch { return null } };
const lset = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} };

let sb, channel;
let me = ls("rk_name"), roomCode = ls("rk_room");
let members = [], cats = [], expenses = [], closings = [], view = null;
let monthOffset = 0, selCat = "", selPayer = "", err = "", busy = false;

const monthKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
function settle(mem, paid, share) {          // kisko kisko kitna dena hai
  const debt = [], cred = [];
  mem.forEach((m, i) => { const d = paid[i] - share; if (d > 0.5) cred.push([m, d]); else if (d < -0.5) debt.push([m, -d]); });
  const out = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const a = Math.min(debt[i][1], cred[j][1]);
    out.push({from: debt[i][0], to: cred[j][0], amount: Math.round(a * 100) / 100});
    debt[i][1] -= a; cred[j][1] -= a;
    if (debt[i][1] < 0.5) i++; if (cred[j][1] < 0.5) j++;
  }
  return out;
}
function toast(t) {
  const d = document.createElement("div"); d.className = "toast"; d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 4000);
}

function init() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && roomCode) loadAll(); });
  if (me && roomCode) startRoom(); else renderSetup();
}

/* ---------- Setup ---------- */
function renderSetup() {
  $("view").innerHTML = `<div class="setup">
    <div class="logo">🏠</div>
    <h1>Room Kharcha</h1>
    <p>Dono dost ka kharcha, ek jagah. Koi bhi entry dale, dono ko turant dikhe.</p>
    <div class="card">
      <div class="lbl" style="margin-top:0">Aapka naam</div>
      <input id="sName" placeholder="Jaise: Rahul" value="${esc(me || "")}">
      <button style="width:100%;margin-top:6px" ${busy ? "disabled" : ""} onclick="createRoom()">✨ Naya room banao</button>
      <div class="or">ya dost ka code daalo</div>
      <input id="sCode" class="codein" maxlength="6" placeholder="······">
      <button class="sec" style="width:100%;margin-top:6px" ${busy ? "disabled" : ""} onclick="joinRoom()">Room join karo</button>
      <div class="err">${esc(err)}</div>
    </div></div>`;
}
function genCode() { return Array.from({length: 6}, () => CHARS[Math.floor(Math.random() * CHARS.length)]).join(""); }
async function createRoom() {
  if (busy) return;
  const name = $("sName").value.trim(); if (!name) { err = "Pehle apna naam daalo"; return renderSetup(); }
  busy = true; err = ""; renderSetup();
  try {
    let code = null;
    for (let i = 0; i < 6 && !code; i++) {            // code unique hone tak naya try
      const c = genCode();
      const r = await sb.from("rooms").insert({code: c, members: [name]});
      if (!r.error) code = c;
      else if (r.error.code !== "23505") throw r.error;
    }
    if (!code) throw new Error("Unique code nahi ban paya, dobara try karo");
    const r2 = await sb.from("categories").insert(DEFAULT_CATS.map(n => ({room_code: code, name: n})));
    if (r2.error) throw r2.error;
    me = name; roomCode = code; lset("rk_name", me); lset("rk_room", code); busy = false; startRoom();
  } catch (e) { busy = false; err = e.message; renderSetup(); }
}
async function joinRoom() {
  if (busy) return;
  const name = $("sName").value.trim(), code = $("sCode").value.trim().toUpperCase();
  if (!name || code.length !== 6) { err = "Naam aur 6 letter ka code daalo"; return renderSetup(); }
  busy = true; err = ""; renderSetup();
  try {
    const r = await sb.from("rooms").select("members").eq("code", code).maybeSingle();
    if (r.error) throw r.error;
    if (!r.data) throw new Error("Ye room code nahi mila");
    if (!r.data.members.includes(name)) {
      const u = await sb.from("rooms").update({members: [...r.data.members, name]}).eq("code", code);
      if (u.error) throw u.error;
    }
    me = name; roomCode = code; lset("rk_name", me); lset("rk_room", code); busy = false; startRoom();
  } catch (e) { busy = false; err = e.message; renderSetup(); }
}
function leaveRoom() {
  if (!confirm("Room chhodna hai? (Data safe rahega, code se dobara join kar sakte ho)")) return;
  if (channel) sb.removeChannel(channel);
  channel = null; lset("rk_room", null); roomCode = null; members = []; cats = []; expenses = []; renderSetup();
}

/* ---------- Live room ---------- */
let healing = false;
async function healRoom(row) {
  if (!row) {                                            // room row hi nahi hai -> wahi code se dobara banao
    const r = await sb.from("rooms").insert({code: roomCode, members: [me]});
    if (r.error && r.error.code !== "23505") { toast("Room dobara nahi bana: " + r.error.message); return; }
    if (!r.error) {
      const c = await sb.from("categories").insert(DEFAULT_CATS.map(n => ({room_code: roomCode, name: n})));
      if (c.error && c.error.code !== "23505") toast("Categories nahi bani: " + c.error.message);
    }
    if (r.error) row = (await sb.from("rooms").select("members").eq("code", roomCode).maybeSingle()).data;   // dost ne pehle bana diya
    else return;
  }
  if (row && !row.members.includes(me)) {
    const u = await sb.from("rooms").update({members: [...row.members, me]}).eq("code", roomCode);
    if (u.error) toast("Members update nahi hua: " + u.error.message);
  }
}
async function loadAll() {
  const [m, c, e, cl] = await Promise.all([
    sb.from("rooms").select("members").eq("code", roomCode).maybeSingle(),
    sb.from("categories").select("name").eq("room_code", roomCode).order("name"),
    sb.from("expenses").select("*").eq("room_code", roomCode).order("created_at", {ascending: false}),
    sb.from("month_closings").select("*").eq("room_code", roomCode)
  ]);
  closings = cl.error ? [] : cl.data;
  if (!m.error && roomCode && (!m.data || !m.data.members.includes(me))) {   // room DB se ud gaya ya naam members mein nahi -> khud theek karo
    if (!healing) { healing = true; try { await healRoom(m.data); } finally { healing = false; } return loadAll(); }
  }
  if (m.error || c.error || e.error) { toast("Data load nahi hua: " + (m.error || c.error || e.error).message); return; }
  members = (m.data && m.data.members) || [];
  cats = c.data.map(x => x.name);
  expenses = e.data.map(x => ({id: x.id, amount: Number(x.amount), category: x.category, note: x.note,
    paidBy: x.paid_by, addedBy: x.added_by, timestamp: new Date(x.created_at).getTime()}));
  renderHome();
}
function startRoom() {
  if (channel) sb.removeChannel(channel);
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  channel = sb.channel("room-" + roomCode)
    .on("postgres_changes", {event: "*", schema: "public", table: "expenses", filter: `room_code=eq.${roomCode}`}, p => {
      if (p.eventType === "INSERT" && p.new.added_by !== me) {
        const msg = `${p.new.added_by} ne ${rs(Number(p.new.amount))} joda — ${p.new.category} (${p.new.paid_by} ne diye)`;
        toast(msg);
        try { if (Notification.permission === "granted") new Notification("Room Kharcha", {body: msg}); } catch {}
      }
      loadAll();
    })
    .on("postgres_changes", {event: "*", schema: "public", table: "categories", filter: `room_code=eq.${roomCode}`}, loadAll)
    .on("postgres_changes", {event: "*", schema: "public", table: "rooms", filter: `code=eq.${roomCode}`}, loadAll)
    .on("postgres_changes", {event: "*", schema: "public", table: "month_closings", filter: `room_code=eq.${roomCode}`}, loadAll)
    .on("postgres_changes", {event: "DELETE", schema: "public", table: "expenses"}, loadAll)
    .on("postgres_changes", {event: "DELETE", schema: "public", table: "categories"}, loadAll)
    .on("postgres_changes", {event: "DELETE", schema: "public", table: "month_closings"}, loadAll)
    .subscribe();
  renderHome();
  loadAll();
}

function dayLabel(ts) {
  const d = new Date(ts), t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((t - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  const full = d.toLocaleDateString("en-IN", {weekday: "short", day: "numeric", month: "short", year: "numeric"});
  if (diff === 0) return "Aaj • " + full; if (diff === 1) return "Kal • " + full;
  return full;
}

function renderHome() {
  if (!roomCode) return;
  const mem = members.length ? members : [me];
  const d = new Date(); d.setDate(1); d.setHours(0, 0, 0, 0); d.setMonth(d.getMonth() + monthOffset);
  const start = d.getTime(), label = d.toLocaleString("en-IN", {month: "long", year: "numeric"});
  d.setMonth(d.getMonth() + 1); const end = d.getTime();
  const list = expenses.filter(e => e.timestamp >= start && e.timestamp < end);
  const total = list.reduce((a, e) => a + e.amount, 0), share = total / mem.length;
  const bycat = {}; list.forEach(e => bycat[e.category || "Other"] = (bycat[e.category || "Other"] || 0) + e.amount);
  const catRows = Object.entries(bycat).sort((a, b) => b[1] - a[1]);
  const paid = mem.map(m => list.filter(e => e.paidBy === m).reduce((a, e) => a + e.amount, 0));
  const key = monthKey(new Date(start));
  const closed = closings.find(c => c.month === key);
  const transfers = settle(mem, paid, share);
  view = {key, total, transfers, label};
  const line = t => `<b>${esc(t.from)}</b> → <b>${esc(t.to)}</b> &nbsp;${rs(Number(t.amount))}`;
  const closeBlock = closed
    ? `<div class="card" style="background:#fff7ed;border:1.5px solid #fdba74"><h3>🔒 ${label} ka khata band hai</h3>
        <div style="font-size:15px;line-height:1.7">${closed.summary && closed.summary.length ? closed.summary.map(line).join("<br>") : "Sab barabar tha 🎉"}</div>
        <small style="color:var(--mut)">${esc(closed.closed_by)} ne ${new Date(closed.closed_at).toLocaleDateString("en-IN", {day: "numeric", month: "short"})} ko band kiya • Total ${rs(Number(closed.total))}</small>
        <div style="margin-top:10px"><button class="sec" onclick="reopenMonth('${key}')">Dobara kholo</button></div></div>`
    : (list.length ? `<div class="card"><h3>Mahine ka hisaab barabar karo</h3>
        <div style="font-size:15px;line-height:1.7;margin-bottom:12px">${transfers.length ? transfers.map(line).join("<br>") : "Sab pehle se barabar hai 🎉"}</div>
        <button style="width:100%" onclick="closeMonth()">✅ Hisaab barabar, mahina band karo</button></div>` : "");

  const people = mem.map((m, i) => {
    const diff = paid[i] - share;
    const st = diff > 0.5 ? `<div class="st good">+${rs(diff)}<br><small style="font-weight:500">milenge</small></div>`
      : diff < -0.5 ? `<div class="st bad">−${rs(-diff)}<br><small style="font-weight:500">dena hai</small></div>`
      : `<div class="st eq">barabar ✓</div>`;
    return `<div class="person"><div class="av" style="background:${COLORS[i % COLORS.length]}">${esc(m.trim().charAt(0).toUpperCase())}</div>
      <div class="i"><b>${esc(m)}${m === me ? " (aap)" : ""}</b><small>${rs(paid[i])} diye</small></div>${st}</div>`;
  }).join("");
  const bar = total > 0 ? `<div class="split">${mem.map((m, i) => `<i style="width:${paid[i] / total * 100}%;background:${COLORS[i % COLORS.length]}"></i>`).join("")}</div>` : "";

  let rows = "", lastDay = "";
  list.forEach(e => {
    const dl = dayLabel(e.timestamp);
    if (dl !== lastDay) { rows += `<div class="day">${dl}</div>`; lastDay = dl; }
    rows += `<div class="exp"><div class="e">${em(e.category)}</div>
      <div class="m"><b>${esc(e.category || "Other")}</b>
      <small>${e.note ? esc(e.note) + " • " : ""}${esc(e.paidBy)} ne diye${e.addedBy && e.addedBy !== e.paidBy ? " • " + esc(e.addedBy) + " ne likha" : ""}</small>
      <small style="color:var(--brand2);font-weight:600">📅 ${new Date(e.timestamp).toLocaleString("en-IN", {day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true})}</small></div>
      <div style="text-align:right"><div class="a">${rs(e.amount)}</div><small style="color:var(--mut);font-size:12px">${new Date(e.timestamp).toLocaleTimeString("en-IN", {hour: "numeric", minute: "2-digit", hour12: true})}</small></div>${closed ? "" : `<button class="x" onclick="delExpense('${esc(e.id)}')">✕</button>`}</div>`;
  });

  $("view").innerHTML = `
  <div class="hero">
    <div class="bar"><h1>🏠 Room Kharcha</h1><button class="icon" onclick="openCats()">🏷️ Categories</button></div>
    <div class="pill"><button onclick="monthOffset--;renderHome()">‹</button><b>${label}${closed ? " 🔒" : ""}</b>
      <button ${monthOffset >= 0 ? "disabled" : ""} onclick="monthOffset++;renderHome()">›</button></div>
    <div class="total"><small>Is mahine ka total</small><div class="n">${rs(total)}</div>
      <small>Har ka hissa ${rs(share)}</small></div>
    <div class="codebox"><div><span>ROOM CODE — dost ko ye bhejo</span><b>${esc(roomCode)}</b></div>
      <div style="display:flex;gap:6px"><button class="icon" onclick="copyCode()">Copy</button><button class="icon" onclick="shareCode()">Share</button></div></div>
  </div>

  <div class="card"><h3>Hisaab</h3><div class="people">${people}</div>${bar}</div>
  ${closeBlock}

  ${catRows.length ? `<div class="card"><h3>Kahan kharch hua</h3>${catRows.map(([c, v]) => `
    <div class="cat"><div class="e">${em(c)}</div><div class="m"><div class="t"><span>${esc(c)}</span><span>${rs(v)}</span></div>
    <div class="b"><i style="width:${v / total * 100}%"></i></div></div></div>`).join("")}</div>` : ""}

  ${list.length ? rows : `<div class="empty"><div class="big">🧾</div><p>Is mahine abhi koi kharcha nahi.<br>Neeche <b>+ Kharcha</b> dabake pehla add karo.</p></div>`}

  <p style="text-align:center;margin-top:24px"><button class="ghost" onclick="leaveRoom()">Room chhodo</button></p>
  <p style="text-align:center;color:var(--mut);font-size:12px;margin-top:4px">Version 7 • app install wala</p>
  <button class="fab" onclick="openAdd()">＋ Kharcha</button>`;
}

function copyCode() {
  navigator.clipboard && navigator.clipboard.writeText(roomCode).then(() => toast("Code copy ho gaya: " + roomCode), () => toast("Code: " + roomCode));
}
function shareCode() {
  const text = `Room Kharcha join karo: ${location.href.split("#")[0]}\nRoom code: ${roomCode}`;
  if (navigator.share) navigator.share({text}).catch(() => {}); else copyCode();
}

/* ---------- Add expense ---------- */
function chips(id, items, sel, fn, withEmoji) {
  $(id).innerHTML = items.map(x => `<span class="chip ${x === sel ? "on" : ""}" data-v="${esc(x)}">${withEmoji ? em(x) + " " : ""}${esc(x)}</span>`).join("");
  $(id).onclick = ev => { const v = ev.target.dataset && ev.target.dataset.v; if (v != null) { fn(v); chips(id, items, v, fn, withEmoji); } };
}
const isClosedFor = d => closings.some(c => c.month === monthKey(d));
const toLocalInput = d => { const z = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`; };
function openAdd() {
  $("aAmt").value = ""; $("aNote").value = ""; $("aWhen").value = toLocalInput(new Date());
  selCat = cats[0] || "Other"; selPayer = me;
  chips("aCats", cats.length ? cats : ["Other"], selCat, v => selCat = v, true);
  chips("aPayers", members.length ? members : [me], selPayer, v => selPayer = v, false);
  $("addDlg").showModal(); setTimeout(() => $("aAmt").focus(), 100);
}
let saving = false;
async function saveExpense() {
  if (saving) return;                       // dobara click ignore
  let when = new Date($("aWhen").value); if (isNaN(when)) when = new Date();
  if (isClosedFor(when)) { toast("Us mahine ka khata band hai. Pehle 'Dobara kholo' karo."); return; }
  const amount = parseFloat($("aAmt").value);
  if (!(amount > 0)) { toast("Sahi amount daalo"); return; }
  saving = true;
  const btn = $("saveBtn"); btn.disabled = true; btn.textContent = "Save ho raha hai...";
  const row = {room_code: roomCode, amount, category: selCat, note: $("aNote").value.trim(), paid_by: selPayer, added_by: me, created_at: when.toISOString()};
  $("addDlg").close();                      // turant band, dobara tap na ho
  const r = await sb.from("expenses").insert(row);
  saving = false; btn.disabled = false; btn.textContent = "Save karo";
  if (r.error) { toast("Save nahi hua: " + r.error.message); return; }
  loadAll();
}
const pending = new Set();
async function delExpense(id) {
  if (pending.has(id)) return;
  const e = expenses.find(x => x.id === id);
  if (e && closings.some(c => c.month === monthKey(new Date(e.timestamp)))) { toast("Band mahine ki entry delete nahi hogi. Pehle khata dobara kholo."); return; }
  if (e && confirm(`Delete karein?\n${e.category} ${rs(e.amount)} (${e.paidBy})`)) {
    pending.add(id);
    const r = await sb.from("expenses").delete().eq("id", id);
    pending.delete(id);
    if (r.error) toast(r.error.message); else loadAll();
  }
}

/* ---------- Month close ---------- */
let closing = false;
async function closeMonth() {
  if (closing || !view) return;
  const {key, total, transfers, label} = view;
  const txt = transfers.length ? transfers.map(t => `${t.from} → ${t.to}: ${rs(t.amount)}`).join("\n") : "Sab pehle se barabar hai";
  if (!confirm(`${label} ka khata band karein?\n\n${txt}\n\nBand hone ke baad is mahine mein naya kharcha nahi judega (Dobara kholo se khol sakte ho).`)) return;
  closing = true;
  const r = await sb.from("month_closings").insert({room_code: roomCode, month: key, closed_by: me, total, summary: transfers});
  closing = false;
  if (r.error) {
    toast(r.error.code === "23505" ? "Ye mahina pehle hi band hai"
      : /month_closings/.test(r.error.message) ? "Pehle naya SQL chalao (month_closings table)" : r.error.message);
  }
  loadAll();
}
async function reopenMonth(key) {
  if (!confirm("Is mahine ka khata dobara kholna hai?")) return;
  const r = await sb.from("month_closings").delete().eq("room_code", roomCode).eq("month", key);
  if (r.error) toast(r.error.message);
  loadAll();
}

/* ---------- Categories ---------- */
function openCats() { renderCats(); $("catDlg").showModal(); }
function renderCats() {
  $("cList").innerHTML = cats.map((c, i) => `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line)">
    <span>${em(c)} ${esc(c)}</span><button class="ghost" style="color:var(--bad)" onclick="delCat(${i})">Hatao</button></div>`).join("");
}
let addingCat = false;
async function addCat() {
  const n = $("cNew").value.trim(); if (!n || addingCat) return;
  addingCat = true;
  const r = await sb.from("categories").upsert({room_code: roomCode, name: n}, {onConflict: "room_code,name"});
  addingCat = false;
  if (r.error) { toast(r.error.message); return; }
  $("cNew").value = ""; await loadAll(); renderCats();
}
async function delCat(i) {
  const r = await sb.from("categories").delete().eq("room_code", roomCode).eq("name", cats[i]);
  if (r.error) { toast(r.error.message); return; }
  await loadAll(); renderCats();
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
init();
</script>
</body>
</html>
